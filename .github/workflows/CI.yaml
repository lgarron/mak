name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0
      - uses: Swatinem/rust-cache@v2.9.3
      - run: make build
      - run: make cargo-test
      - run: make test-build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0
      - uses: Swatinem/rust-cache@v2.9.3
      - run: make lint
